name: Task
description: Maintenance, clean-up, docs, infrastructure — neither a bug nor a new feature.
title: "Area: what to do"
type: Task
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why now? What happens if it stays undone?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions, one checkbox per line.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
